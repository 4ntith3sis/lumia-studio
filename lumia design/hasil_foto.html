<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumia Photobooth — Hasil Foto</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <svg class="bg-blob-top-right" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M380 0H120C150 70 200 120 280 140C360 160 400 240 400 320V0H380Z" fill="#FF5232" opacity="0.85"/>
    <path d="M400 0H200C240 50 280 80 340 100C400 120 400 200 400 200V0Z" fill="#FF85A1" opacity="0.9"/>
    <path d="M400 0H280C310 30 350 50 400 60V0Z" fill="#FFB800"/>
  </svg>

  <svg class="bg-blob-bottom-left" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 400V120C70 150 120 200 140 280C160 360 240 400 320 400H0Z" fill="#FF5232" opacity="0.85"/>
    <path d="M0 400V200C50 240 80 280 100 340C120 400 200 400 200 400H0Z" fill="#FFB800"/>
  </svg>

  <div id="app-root">
    <header class="app-header">
      <div class="brand-logo">
        lumia<span class="logo-dot">.</span>
      </div>
    </header>

    <main class="screen-container">
      <section class="screen-page active">
        <div class="content-wrapper">
          <div class="text-center">
            <h2 class="title-primary">Keren! Ini Hasil Foto Kamu</h2>
            <p class="subtitle">Periksa foto-foto kamu sebelum melangkah ke studio kustomisasi.</p>
          </div>

          <div class="results-gallery-grid" id="results-gallery-grid"></div>

          <div class="actions-row" style="display:flex; gap: 1rem; margin-top:1rem;">
            <a href="take_foto.html" class="btn-secondary">
              <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              Ulang Foto
            </a>
            <a href="pilih_frame.html" class="btn-primary">
              <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.92 0 1.7-.71 1.7-1.63 0-.44-.18-.85-.46-1.15-.27-.29-.44-.7-.44-1.15 0-.92.78-1.67 1.7-1.67h2.5c3.04 0 5.5-2.46 5.5-5.5C22 6.5 17.5 2 12 2z"></path></svg>
              Pilih Frame & Filter
              <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </a>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const grid = document.getElementById('results-gallery-grid');
    const photos = JSON.parse(sessionStorage.getItem('lumia_captured_photos') || '[]');
    photos.forEach(url => {
      const card = document.createElement('div');
      card.className = 'result-card-item';
      const img = document.createElement('img');
      img.src = url;
      card.appendChild(img);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
