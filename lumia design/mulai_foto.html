<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumia Photobooth — Persiapan Foto</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Background Wave Graphics -->
  <svg class="bg-blob-top-right" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M380 0H120C150 70 200 120 280 140C360 160 400 240 400 320V0H380Z" fill="#FF5232" opacity="0.85"/>
    <path d="M400 0H200C240 50 280 80 340 100C400 120 400 200 400 200V0Z" fill="#FF85A1" opacity="0.9"/>
    <path d="M400 0H280C310 30 350 50 400 60V0Z" fill="#FFB800"/>
  </svg>

  <svg class="bg-blob-bottom-left" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 400V120C70 150 120 200 140 280C160 360 240 400 320 400H0Z" fill="#FF5232" opacity="0.85"/>
    <path d="M0 400V200C50 240 80 280 100 340C120 400 200 400 200 400H0Z" fill="#FFB800"/>
  </svg>

  <div id="app-root">
    <header class="app-header">
      <div class="brand-logo">
        lumia<span class="logo-dot">.</span>
      </div>
    </header>

    <main class="screen-container">
      <section class="screen-page active">
        <div class="content-wrapper">
          <div class="prep-card">
            <div class="prep-illustration">
              <svg class="icon-svg" viewBox="0 0 24 24" width="48" height="48" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path>
                <circle cx="12" cy="13" r="3"></circle>
              </svg>
            </div>
            <div class="text-center">
              <h2 class="title-primary">Siapkan Pose Terbaikmu!</h2>
              <p class="subtitle" style="margin-top:0.4rem;">Kamera akan mengambil foto otomatis sesuai jumlah yang kamu pilih.</p>
            </div>

            <div class="prep-checklist">
              <div class="prep-item">
                <span class="prep-item-icon">✓</span>
                <span>Posisikan wajah tepat di tengah area kamera.</span>
              </div>
              <div class="prep-item">
                <span class="prep-item-icon">✓</span>
                <span>Tersedia countdown 3 detik sebelum snapshot.</span>
              </div>
              <div class="prep-item">
                <span class="prep-item-icon">✓</span>
                <span>Senyum dan ekspresikan gaya terbaikmu bersama Lumia!</span>
              </div>
            </div>

            <div class="actions-row" style="display:flex; gap: 1rem; width:100%; justify-content:center;">
              <a href="jumlah_foto.html" class="btn-secondary">
                <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                Kembali
              </a>
              <a href="take_foto.html" class="btn-primary">
                <svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
                Mulai Kamera & Foto
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

</body>
</html>
