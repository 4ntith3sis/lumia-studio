<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumia Photobooth — Studio Frame & Filter</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <svg class="bg-blob-top-right" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M380 0H120C150 70 200 120 280 140C360 160 400 240 400 320V0H380Z" fill="#FF5232" opacity="0.85"/>
    <path d="M400 0H200C240 50 280 80 340 100C400 120 400 200 400 200V0Z" fill="#FF85A1" opacity="0.9"/>
    <path d="M400 0H280C310 30 350 50 400 60V0Z" fill="#FFB800"/>
  </svg>

  <svg class="bg-blob-bottom-left" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 400V120C70 150 120 200 140 280C160 360 240 400 320 400H0Z" fill="#FF5232" opacity="0.85"/>
    <path d="M0 400V200C50 240 80 280 100 340C120 400 200 400 200 400H0Z" fill="#FFB800"/>
  </svg>

  <div id="app-root">
    <header class="app-header">
      <div class="brand-logo">
        lumia<span class="logo-dot">.</span>
      </div>
    </header>

    <main class="screen-container">
      <section class="screen-page active">
        <div class="content-wrapper" style="height: 100%;">
          <div class="studio-layout">

            <!-- Canvas Preview -->
            <div class="studio-preview-wrapper">
              <canvas id="studio-composite-canvas" width="600" height="800"></canvas>
            </div>

            <!-- Controls Panel -->
            <div class="studio-controls-panel">
              <div class="studio-tabs-nav">
                <button class="studio-tab-btn active" data-tab="tab-frames">
                  <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
                  Frame Overlay
                </button>
                <button class="studio-tab-btn" data-tab="tab-filters">
                  <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"></path></svg>
                  Filter Efek
                </button>
              </div>

              <!-- Tab 1: Frame -->
              <div id="tab-frames" class="studio-tab-content active">
                <div class="options-grid" id="frames-options-grid"></div>
              </div>

              <!-- Tab 2: Filter -->
              <div id="tab-filters" class="studio-tab-content">
                <div class="options-grid" id="filters-options-grid"></div>
              </div>

              <div style="display:flex; gap:1rem; align-items:center; margin-top:auto; pt:1rem; border-top:2px solid var(--border-dark)">
                <a href="hasil_foto.html" class="btn-secondary">
                  <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
                  Kembali
                </a>
                <button id="btn-proceed-to-final" class="btn-primary" style="flex:1;">
                  Simpan & Lihat Hasil
                  <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                </button>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/frames.js"></script>
  <script>
    const photos = JSON.parse(sessionStorage.getItem('lumia_captured_photos') || '[]');
    const photoCount = parseInt(sessionStorage.getItem('lumia_photo_count') || '4', 10);

    let selectedFrameId = sessionStorage.getItem('lumia_frame_id') || 'frame-lumia-classic';
    let selectedFilterId = sessionStorage.getItem('lumia_filter_id') || 'filter-normal';

    const FILTERS = [
      { id: 'filter-normal', name: 'Normal', css: 'none' },
      { id: 'filter-vintage', name: 'Vintage Warm', css: 'sepia(0.35) contrast(1.1) brightness(1.05) saturate(1.2)' },
      { id: 'filter-bw', name: 'Monochrome', css: 'grayscale(1) contrast(1.2) brightness(0.95)' },
      { id: 'filter-pastel', name: 'Soft Pastel', css: 'saturate(1.3) brightness(1.1) hue-rotate(-10deg)' },
      { id: 'filter-cyber', name: 'Cyber Neon', css: 'hue-rotate(190deg) saturate(1.8) contrast(1.1)' },
      { id: 'filter-sepia', name: 'Retro Sepia', css: 'sepia(0.85) contrast(1.1) brightness(0.95)' },
      { id: 'filter-sharp', name: 'Vibrant Pop', css: 'contrast(1.35) saturate(1.5)' }
    ];

    const canvas = document.getElementById('studio-composite-canvas');
    const framesGrid = document.getElementById('frames-options-grid');
    const filtersGrid = document.getElementById('filters-options-grid');

    function renderOptions() {
      framesGrid.innerHTML = '';
      window.LUMIA_FRAMES.forEach(f => {
        const card = document.createElement('div');
        card.className = `option-card ${selectedFrameId === f.id ? 'selected' : ''}`;
        card.onclick = () => {
          selectedFrameId = f.id;
          sessionStorage.setItem('lumia_frame_id', f.id);
          renderOptions();
          drawCanvas();
        };

        const box = document.createElement('div');
        box.className = 'option-preview-box';
        box.style.background = f.bgColor;
        box.style.color = f.textColor;
        box.style.border = `2px solid ${f.borderColor}`;
        box.textContent = f.name;

        const title = document.createElement('div');
        title.className = 'option-title';
        title.textContent = f.name;

        card.appendChild(box); card.appendChild(title);
        framesGrid.appendChild(card);
      });

      filtersGrid.innerHTML = '';
      FILTERS.forEach(f => {
        const card = document.createElement('div');
        card.className = `option-card ${selectedFilterId === f.id ? 'selected' : ''}`;
        card.onclick = () => {
          selectedFilterId = f.id;
          sessionStorage.setItem('lumia_filter_id', f.id);
          renderOptions();
          drawCanvas();
        };

        const box = document.createElement('div');
        box.className = 'option-preview-box';
        box.style.background = '#FFF5E4';
        box.style.filter = f.css;
        box.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3z"></path></svg>';

        const title = document.createElement('div');
        title.className = 'option-title';
        title.textContent = f.name;

        card.appendChild(box); card.appendChild(title);
        filtersGrid.appendChild(card);
      });
    }

    function drawCanvas() {
      const ctx = canvas.getContext('2d');
      const w = 600, h = 800;
      canvas.width = w; canvas.height = h;

      const frame = window.LUMIA_FRAMES.find(f => f.id === selectedFrameId) || window.LUMIA_FRAMES[0];
      const filter = FILTERS.find(f => f.id === selectedFilterId) || FILTERS[0];

      ctx.fillStyle = frame.bgColor; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = frame.borderColor; ctx.lineWidth = 14; ctx.strokeRect(7, 7, w - 14, h - 14);

      const padding = 24;
      const count = Math.min(photos.length, photoCount);
      ctx.filter = filter.css;

      if (count === 1) {
        drawPhoto(ctx, photos[0], padding, padding, w - padding*2, h - padding*2 - 60);
      } else if (count === 2) {
        const photoH = (h - padding*3 - 60)/2;
        drawPhoto(ctx, photos[0], padding, padding, w - padding*2, photoH);
        drawPhoto(ctx, photos[1], padding, padding*2 + photoH, w - padding*2, photoH);
      } else if (count === 3) {
        const photoH = (h - padding*4 - 60)/3;
        for (let i = 0; i < 3; i++) drawPhoto(ctx, photos[i], padding, padding + i*(photoH + padding), w - padding*2, photoH);
      } else if (count === 6) {
        const gap = 12;
        const photoW = (w - padding*2 - gap)/2;
        const photoH = (h - padding*2 - gap*2 - 60)/3;
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 2; c++) {
            const idx = r*2 + c;
            if (photos[idx]) drawPhoto(ctx, photos[idx], padding + c*(photoW + gap), padding + r*(photoH + gap), photoW, photoH);
          }
        }
      } else {
        const gap = 16;
        const photoW = (w - padding*2 - gap)/2;
        const photoH = (h - padding*2 - gap - 60)/2;
        drawPhoto(ctx, photos[0], padding, padding, photoW, photoH);
        drawPhoto(ctx, photos[1], padding + photoW + gap, padding, photoW, photoH);
        drawPhoto(ctx, photos[2], padding, padding + photoH + gap, photoW, photoH);
        drawPhoto(ctx, photos[3], padding + photoW + gap, padding + photoH + gap, photoW, photoH);
      }

      ctx.filter = 'none';
      ctx.fillStyle = frame.textColor;
      ctx.font = '800 18px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(frame.watermark, w/2, h - 26);
    }

    function drawPhoto(ctx, url, x, y, w, h) {
      if (!url) return;
      const img = new Image();
      img.onload = () => {
        ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.clip();
        ctx.drawImage(img, x, y, w, h); ctx.restore();
      };
      img.src = url;
    }

    // Tabs logic
    const tabBtns = document.querySelectorAll('.studio-tab-btn');
    const tabContents = document.querySelectorAll('.studio-tab-content');
    tabBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        tabBtns.forEach(b => b.classList.remove('active'));
        tabContents.forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(btn.dataset.tab).classList.add('active');
      });
    });

    document.getElementById('btn-proceed-to-final').addEventListener('click', () => {
      window.location.href = 'hasil_akhir.html';
    });

    renderOptions();
    drawCanvas();
  </script>
</body>
</html>
