<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumia Photobooth — Your Moment Is Ready</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Background Wave Graphics -->
  <svg class="bg-blob-top-right" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M380 0H120C150 70 200 120 280 140C360 160 400 240 400 320V0H380Z" fill="#FF5232" opacity="0.85"/>
    <path d="M400 0H200C240 50 280 80 340 100C400 120 400 200 400 200V0Z" fill="#FF85A1" opacity="0.9"/>
    <path d="M400 0H280C310 30 350 50 400 60V0Z" fill="#FFB800"/>
  </svg>

  <svg class="bg-blob-bottom-left" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 400V120C70 150 120 200 140 280C160 360 240 400 320 400H0Z" fill="#FF5232" opacity="0.85"/>
    <path d="M0 400V200C50 240 80 280 100 340C120 400 200 400 200 400H0Z" fill="#FFB800"/>
  </svg>

  <div id="app-root">
    <header class="app-header">
      <div class="brand-logo">
        lumia<span class="logo-dot">.</span>
      </div>
    </header>

    <main class="screen-container">
      <section class="screen-page active">
        <div class="content-wrapper">
          
          <div class="text-center">
            <div class="brand-logo" style="justify-content: center; font-size: 1.5rem; margin-bottom: 0.25rem;">
              lumia<span class="logo-dot">.</span>
            </div>
            <h2 class="title-primary">Momen Terbaikmu Siap Diunduh!</h2>
            <p class="subtitle" style="margin-top:0.2rem;">Pilih format hasil foto yang ingin kamu simpan ke perangkatmu.</p>
          </div>

          <!-- 3 Download Cards Grid (Raw photos, Boomerang, Framed photo) -->
          <div class="download-cards-grid">
            
            <!-- Card 1: Raw Photos -->
            <div class="download-card">
              <div class="download-preview-box">
                <div class="raw-photos-row" id="raw-photos-row-preview"></div>
              </div>
              <div class="download-card-title">Raw photos</div>
              <div class="download-card-desc">Download your original photos</div>
              <button id="btn-download-raw" class="btn-card-download">
                <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download originals
              </button>
            </div>

            <!-- Card 2: Boomerang -->
            <div class="download-card">
              <div class="download-preview-box">
                <canvas id="boomerang-preview-canvas" width="400" height="300"></canvas>
              </div>
              <div class="download-card-title">Boomerang</div>
              <div class="download-card-desc">Download your photo boomerang</div>
              <button id="btn-download-boomerang" class="btn-card-download">
                <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download boomerang
              </button>
            </div>

            <!-- Card 3: Framed Photo -->
            <div class="download-card">
              <div class="download-preview-box">
                <canvas id="final-composite-canvas" width="600" height="800"></canvas>
              </div>
              <div class="download-card-title">Framed photo</div>
              <div class="download-card-desc">Download your final photo</div>
              <button id="btn-download-framed" class="btn-card-download" style="background: var(--accent-primary); color: #FFF;">
                <svg class="icon-svg" viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                Download final photo
              </button>
            </div>

          </div>

          <!-- Bottom Navigation Actions -->
          <div class="download-bottom-actions">
            <button id="btn-start-again" class="btn-primary">
              <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
              Mulai Sesi Baru
            </button>
            <a href="pilih_frame.html" class="btn-secondary" style="background:transparent; border-color:transparent; box-shadow:none;">
              <svg class="icon-svg" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
              Kembali ke Studio
            </a>
          </div>

        </div>
      </section>
    </main>
  </div>

  <script src="assets/frames.js"></script>
  <script>
    const photos = JSON.parse(sessionStorage.getItem('lumia_captured_photos') || '[]');
    const photoCount = parseInt(sessionStorage.getItem('lumia_photo_count') || '4', 10);
    const selectedFrameId = sessionStorage.getItem('lumia_frame_id') || 'frame-lumia-classic';
    const selectedFilterId = sessionStorage.getItem('lumia_filter_id') || 'filter-normal';

    const FILTERS = [
      { id: 'filter-normal', name: 'Normal', css: 'none' },
      { id: 'filter-vintage', name: 'Vintage Warm', css: 'sepia(0.35) contrast(1.1) brightness(1.05) saturate(1.2)' },
      { id: 'filter-bw', name: 'Monochrome', css: 'grayscale(1) contrast(1.2) brightness(0.95)' },
      { id: 'filter-pastel', name: 'Soft Pastel', css: 'saturate(1.3) brightness(1.1) hue-rotate(-10deg)' },
      { id: 'filter-cyber', name: 'Cyber Neon', css: 'hue-rotate(190deg) saturate(1.8) contrast(1.1)' },
      { id: 'filter-sepia', name: 'Retro Sepia', css: 'sepia(0.85) contrast(1.1) brightness(0.95)' },
      { id: 'filter-sharp', name: 'Vibrant Pop', css: 'contrast(1.35) saturate(1.5)' }
    ];

    // 1. Render Raw Photos Row Preview
    const rawRowContainer = document.getElementById('raw-photos-row-preview');
    if (photos.length > 0) {
      photos.forEach(url => {
        const img = document.createElement('img');
        img.src = url;
        img.className = 'raw-thumb-item';
        rawRowContainer.appendChild(img);
      });
    } else {
      rawRowContainer.textContent = 'No photos captured';
    }

    // 2. Render Boomerang Animated Loop Preview
    const bCanvas = document.getElementById('boomerang-preview-canvas');
    const bCtx = bCanvas.getContext('2d');
    let bIndex = 0;
    let bForward = true;

    function animateBoomerang() {
      if (photos.length > 0) {
        const img = new Image();
        img.onload = () => {
          bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
          bCtx.drawImage(img, 0, 0, bCanvas.width, bCanvas.height);
        };
        img.src = photos[bIndex];

        if (bForward) {
          bIndex++;
          if (bIndex >= photos.length) {
            bIndex = photos.length - 2 >= 0 ? photos.length - 2 : 0;
            bForward = false;
          }
        } else {
          bIndex--;
          if (bIndex < 0) {
            bIndex = 1 < photos.length ? 1 : 0;
            bForward = true;
          }
        }
      }
    }
    setInterval(animateBoomerang, 400);

    // 3. Render Framed Photo Canvas
    const fCanvas = document.getElementById('final-composite-canvas');
    function drawFinalCanvas() {
      const ctx = fCanvas.getContext('2d');
      const w = 600, h = 800;
      fCanvas.width = w; fCanvas.height = h;

      const frame = window.LUMIA_FRAMES.find(f => f.id === selectedFrameId) || window.LUMIA_FRAMES[0];
      const filter = FILTERS.find(f => f.id === selectedFilterId) || FILTERS[0];

      ctx.fillStyle = frame.bgColor; ctx.fillRect(0, 0, w, h);
      ctx.strokeStyle = frame.borderColor; ctx.lineWidth = 14; ctx.strokeRect(7, 7, w - 14, h - 14);

      const padding = 24;
      const count = Math.min(photos.length, photoCount);
      ctx.filter = filter.css;

      if (count === 1) {
        drawPhoto(ctx, photos[0], padding, padding, w - padding*2, h - padding*2 - 60);
      } else if (count === 2) {
        const photoH = (h - padding*3 - 60)/2;
        drawPhoto(ctx, photos[0], padding, padding, w - padding*2, photoH);
        drawPhoto(ctx, photos[1], padding, padding*2 + photoH, w - padding*2, photoH);
      } else if (count === 3) {
        const photoH = (h - padding*4 - 60)/3;
        for (let i = 0; i < 3; i++) drawPhoto(ctx, photos[i], padding, padding + i*(photoH + padding), w - padding*2, photoH);
      } else if (count === 6) {
        const gap = 12;
        const photoW = (w - padding*2 - gap)/2;
        const photoH = (h - padding*2 - gap*2 - 60)/3;
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 2; c++) {
            const idx = r*2 + c;
            if (photos[idx]) drawPhoto(ctx, photos[idx], padding + c*(photoW + gap), padding + r*(photoH + gap), photoW, photoH);
          }
        }
      } else {
        const gap = 16;
        const photoW = (w - padding*2 - gap)/2;
        const photoH = (h - padding*2 - gap - 60)/2;
        drawPhoto(ctx, photos[0], padding, padding, photoW, photoH);
        drawPhoto(ctx, photos[1], padding + photoW + gap, padding, photoW, photoH);
        drawPhoto(ctx, photos[2], padding, padding + photoH + gap, photoW, photoH);
        drawPhoto(ctx, photos[3], padding + photoW + gap, padding + photoH + gap, photoW, photoH);
      }

      ctx.filter = 'none';
      ctx.fillStyle = frame.textColor;
      ctx.font = '800 18px Plus Jakarta Sans, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(frame.watermark, w/2, h - 26);
    }

    function drawPhoto(ctx, url, x, y, w, h) {
      if (!url) return;
      const img = new Image();
      img.onload = () => {
        ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.clip();
        ctx.drawImage(img, x, y, w, h); ctx.restore();
      };
      img.src = url;
    }
    drawFinalCanvas();

    // Download Button Actions
    // 1. Download Raw Photos
    document.getElementById('btn-download-raw').addEventListener('click', () => {
      if (photos.length === 0) return alert('Belum ada foto raw yang diambil.');
      photos.forEach((url, i) => {
        const a = document.createElement('a');
        a.download = `Lumia_Raw_Photo_${i + 1}.jpg`;
        a.href = url;
        a.click();
      });
    });

    // 2. Download Boomerang
    document.getElementById('btn-download-boomerang').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `Lumia_Boomerang_${Date.now()}.png`;
      a.href = bCanvas.toDataURL('image/png');
      a.click();
    });

    // 3. Download Final Framed Photo
    document.getElementById('btn-download-framed').addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `Lumia_Framed_Photo_${Date.now()}.png`;
      a.href = fCanvas.toDataURL('image/png');
      a.click();
    });

    // Start Again
    document.getElementById('btn-start-again').addEventListener('click', () => {
      sessionStorage.clear();
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
