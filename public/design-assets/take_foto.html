<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lumia Photobooth — Ambil Foto</title>

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <svg class="bg-blob-top-right" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M380 0H120C150 70 200 120 280 140C360 160 400 240 400 320V0H380Z" fill="#FF5232" opacity="0.85"/>
    <path d="M400 0H200C240 50 280 80 340 100C400 120 400 200 400 200V0Z" fill="#FF85A1" opacity="0.9"/>
    <path d="M400 0H280C310 30 350 50 400 60V0Z" fill="#FFB800"/>
  </svg>

  <svg class="bg-blob-bottom-left" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M0 400V120C70 150 120 200 140 280C160 360 240 400 320 400H0Z" fill="#FF5232" opacity="0.85"/>
    <path d="M0 400V200C50 240 80 280 100 340C120 400 200 400 200 400H0Z" fill="#FFB800"/>
  </svg>

  <div id="app-root">
    <header class="app-header">
      <div class="brand-logo">
        lumia<span class="logo-dot">.</span>
      </div>
    </header>

    <main class="screen-container">
      <section class="screen-page active">
        <div class="content-wrapper" style="height: 100%;">
          <div class="camera-layout">

            <!-- Thumbnails Sidebar -->
            <div class="camera-thumbnails-sidebar">
              <div class="thumb-title">Tangkapan (<span id="captured-count">0</span>/<span id="total-count-target">4</span>)</div>
              <div id="thumb-slots-container" style="display:flex; flex-direction:column; gap:0.5rem;"></div>
            </div>

            <!-- Camera Viewport Card -->
            <div class="camera-viewport-card">
              <div class="camera-hud">
                <div class="hud-pill">
                  <div class="pulse-dot"></div>
                  <span>LIVE CAMERA</span>
                </div>
                <div class="hud-pill">
                  <span id="hud-photo-counter">Foto 1 dari 4</span>
                </div>
              </div>

              <!-- Live Video & Fallback Canvas -->
              <video id="camera-video" autoplay playsinline muted style="display:none;"></video>
              <canvas id="camera-mock-canvas" style="display:block;"></canvas>

              <!-- Countdown Number Overlay -->
              <div class="countdown-overlay" id="countdown-overlay">
                <div class="countdown-number" id="countdown-number">3</div>
              </div>

              <!-- Flash Overlay -->
              <div class="flash-overlay" id="flash-overlay"></div>

              <!-- Shutter Bar -->
              <div class="camera-controls-bottom">
                <a href="mulai_foto.html" class="btn-secondary">Batal</a>
                <button id="btn-trigger-shutter" class="btn-shutter" title="Ambil Foto Sekarang">
                  <div class="btn-shutter-inner"></div>
                </button>
              </div>
            </div>

          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const photoCount = parseInt(sessionStorage.getItem('lumia_photo_count') || '4', 10);
    const capturedPhotos = [];
    let isCapturing = false;
    let cameraStream = null;
    let mockAnimId = null;

    const DOM = {
      video: document.getElementById('camera-video'),
      mockCanvas: document.getElementById('camera-mock-canvas'),
      capturedCount: document.getElementById('captured-count'),
      totalCountTarget: document.getElementById('total-count-target'),
      hudCounter: document.getElementById('hud-photo-counter'),
      thumbSlots: document.getElementById('thumb-slots-container'),
      countdownOverlay: document.getElementById('countdown-overlay'),
      countdownNum: document.getElementById('countdown-number'),
      flashOverlay: document.getElementById('flash-overlay'),
      shutterBtn: document.getElementById('btn-trigger-shutter')
    };

    DOM.totalCountTarget.textContent = photoCount;
    DOM.hudCounter.textContent = `Foto 1 dari ${photoCount}`;

    function renderSlots() {
      DOM.thumbSlots.innerHTML = '';
      for (let i = 0; i < photoCount; i++) {
        const slot = document.createElement('div');
        slot.className = `thumb-slot ${capturedPhotos[i] ? 'captured' : ''}`;
        if (capturedPhotos[i]) {
          const img = document.createElement('img');
          img.src = capturedPhotos[i];
          slot.appendChild(img);
        } else {
          slot.textContent = `#${i + 1}`;
        }
        DOM.thumbSlots.appendChild(slot);
      }
    }
    renderSlots();

    async function initCamera() {
      try {
        cameraStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 1280 }, height: { ideal: 960 }, facingMode: 'user' },
          audio: false
        });
        DOM.video.srcObject = cameraStream;
        DOM.video.style.display = 'block';
        DOM.mockCanvas.style.display = 'none';
      } catch (e) {
        startMock();
      }
    }

    function startMock() {
      DOM.video.style.display = 'none';
      DOM.mockCanvas.style.display = 'block';
      const ctx = DOM.mockCanvas.getContext('2d');
      DOM.mockCanvas.width = 640;
      DOM.mockCanvas.height = 480;
      let t = 0;
      function draw() {
        t += 0.03;
        ctx.fillStyle = '#FFF5E4';
        ctx.fillRect(0, 0, 640, 480);
        ctx.fillStyle = 'rgba(255,82,50,0.15)';
        ctx.beginPath();
        ctx.arc(320 + Math.sin(t)*40, 240 + Math.cos(t)*30, 180, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = '#1E1E1E';
        ctx.beginPath(); ctx.arc(320, 200, 60, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(320, 380, 120, 100, 0, 0, Math.PI*2); ctx.fill();

        ctx.fillStyle = '#FF5232';
        ctx.font = 'bold 16px Plus Jakarta Sans, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('📸 DEMO MOCK CAMERA FEED', 320, 50);
        mockAnimId = requestAnimationFrame(draw);
      }
      draw();
    }

    function captureFrame() {
      const temp = document.createElement('canvas');
      temp.width = 800; temp.height = 600;
      const ctx = temp.getContext('2d');
      ctx.translate(800, 0); ctx.scale(-1, 1);
      if (cameraStream && DOM.video.style.display !== 'none') {
        ctx.drawImage(DOM.video, 0, 0, 800, 600);
      } else {
        ctx.drawImage(DOM.mockCanvas, 0, 0, 800, 600);
      }
      return temp.toDataURL('image/jpeg', 0.92);
    }

    async function startSeq() {
      if (isCapturing) return;
      isCapturing = true;
      for (let i = capturedPhotos.length; i < photoCount; i++) {
        DOM.hudCounter.textContent = `Foto ${i + 1} dari ${photoCount}`;
        await runCountdown(3);
        DOM.flashOverlay.classList.add('active');
        setTimeout(() => DOM.flashOverlay.classList.remove('active'), 350);

        capturedPhotos.push(captureFrame());
        DOM.capturedCount.textContent = capturedPhotos.length;
        renderSlots();

        if (i < photoCount - 1) await new Promise(r => setTimeout(r, 1200));
      }
      isCapturing = false;
      sessionStorage.setItem('lumia_captured_photos', JSON.stringify(capturedPhotos));
      setTimeout(() => window.location.href = 'hasil_foto.html', 800);
    }

    function runCountdown(sec) {
      return new Promise(res => {
        let c = sec;
        DOM.countdownOverlay.classList.add('active');
        DOM.countdownNum.textContent = c;
        const timer = setInterval(() => {
          c--;
          if (c > 0) {
            DOM.countdownNum.textContent = c;
          } else {
            clearInterval(timer);
            DOM.countdownOverlay.classList.remove('active');
            res();
          }
        }, 900);
      });
    }

    DOM.shutterBtn.addEventListener('click', startSeq);
    initCamera();
  </script>
</body>
</html>
